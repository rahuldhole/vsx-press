title: VSX Press
email: mail@rahuldhole.com
description: >-
  Jekyll theme to quick launch vscode extension site via README; seo friendly
baseurl: ""
url: ""

# Theme settings
theme_settings:
  extension_name: "Context Bar"
  publisher: "RahulDhole"
  marketplace_url: "https://marketplace.visualstudio.com/items?itemName=rahuldhole.context-bar-rd"
  github_repo: "https://github.com/rahuldhole/context-bar"
  version: "1.2.0"
  installs: "4,500+"
  rating: "5.0"
  license: "MIT"
  accent_color: "#007acc"
  icon_url: "https://github.com/rahuldhole/context-bar/raw/main/assets/icon.png"

# Plugins
plugins:
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
