<header class="container" role="banner" style="margin-top: var(--pico-spacing);">
  <nav>
    <ul>
      <li>
        <a class="contrast vsx-header__logo" rel="author" href="{{ "/" | relative_url }}">
          <img src="{{ site.theme_settings.icon_url | default: 'https://microsoft.gallerycdn.vsassets.io/extensions/microsoft/visualstudio/1.0.0/1681231231/1/Microsoft.VisualStudio.png' }}" alt="Logo">
          <strong>{{ site.title | escape }}</strong>
        </a>
      </li>
    </ul>
    <ul>
      <li>
        <a class="secondary vsx-header__nav-link" href="{{ site.theme_settings.marketplace_url }}" target="_blank">
          <span class="vsx-icon">
            <img src="{{ '/assets/icons/vscode.svg' | relative_url }}" alt="VS Code">
          </span>
          Marketplace
        </a>
      </li>
      <li>
        <a class="secondary vsx-header__nav-link" href="{{ site.theme_settings.github_repo }}" target="_blank">
          <span class="vsx-icon">
            <img src="{{ '/assets/icons/github.svg' | relative_url }}" alt="GitHub">
          </span>
          GitHub
        </a>
      </li>
      <li>
        <button id="theme-toggle" class="vsx-theme-toggle" aria-label="Toggle dark/light theme">
          <!-- Sun icon (shown in dark mode → click to go light) -->
          <span class="vsx-icon vsx-icon--lg vsx-theme-toggle__sun">
            <img src="{{ '/assets/icons/sun.svg' | relative_url }}" alt="Light mode">
          </span>
          <!-- Moon icon (shown in light mode → click to go dark) -->
          <span class="vsx-icon vsx-icon--lg vsx-theme-toggle__moon">
            <img src="{{ '/assets/icons/moon.svg' | relative_url }}" alt="Dark mode">
          </span>
        </button>
      </li>
    </ul>
  </nav>
</header>
