<header class="container" role="banner" style="margin-top: var(--pico-spacing);">
  <nav>
    <ul>
      <li>
        <a class="contrast" rel="author" href="{{ "/" | relative_url }}" style="display: flex; align-items: center; text-decoration: none;">
          <img src="https://microsoft.gallerycdn.vsassets.io/extensions/microsoft/visualstudio/1.0.0/1681231231/1/Microsoft.VisualStudio.png" alt="Logo" style="width: 32px; height: 32px; margin-right: 12px; border-radius: 4px;">
          <strong>{{ site.title | escape }}</strong>
        </a>
      </li>
    </ul>
    <ul>
      <li><a class="secondary" href="{{ site.theme_settings.marketplace_url }}" target="_blank">VS Code Marketplace</a></li>
      <li><a class="secondary" href="{{ site.theme_settings.github_repo }}" target="_blank">GitHub</a></li>
      <li><button id="theme-toggle" class="contrast outline" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; border: none; cursor: pointer;">Toggle Theme</button></li>
    </ul>
  </nav>
</header>
